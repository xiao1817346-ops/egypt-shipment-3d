<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Position Test v2</title>
<style>body{margin:0;background:#111;overflow:hidden}#msg{position:fixed;top:10px;left:10px;color:#0f0;z-index:10;font-size:14px}</style></head>
<body>
<div id="msg"></div>
<script src="https://lib.baomitu.com/three.js/r128/three.min.js"></script>
<script>
var M=document.getElementById('msg');
M.textContent='Three.js v'+THREE.REVISION;

var s=new THREE.Scene();s.background=new THREE.Color(0x222233);
var c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.5,200);
c.position.set(0,8,25);c.lookAt(0,0,0);
var r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
s.add(new THREE.AmbientLight(0xffffff,1));
var l=new THREE.DirectionalLight(0xffffff,2);l.position.set(10,20,10);s.add(l);

// Ground and grid
var gnd=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshBasicMaterial({color:0x333344}));
gnd.rotation.x=-Math.PI/2;gnd.position.y=-3;s.add(gnd);
s.add(new THREE.GridHelper(80,80,0x555,0x333)).position.y=-2.99;

// Test: 11 colored boxes at X positions -25 to 35
var colors=[0xff0000,0xff4400,0xff8800,0xffcc00,0xffff00,0x00ff00,0x00ffff,0x0088ff,0x0000ff,0x8800ff,0xff00ff];
for(var i=0;i<11;i++){
  var x=-20+i*5;
  var geo=new THREE.BoxGeometry(2,2,2);
  var mat=new THREE.MeshStandardMaterial({color:colors[i],roughness:0.3});
  var m=new THREE.Mesh(geo,mat);m.position.set(x,0,0);m.castShadow=true;
  s.add(m);
  M.textContent+=' | ['+i+']x='+x;
}

// Orbit
var target=new THREE.Vector3(0,0,0);
var spherical=new THREE.Spherical();spherical.setFromVector3(c.position.clone().sub(target));
var dwn=false,lx=0,ly=0;
r.domElement.addEventListener('pointerdown',function(e){dwn=true;lx=e.clientX;ly=e.clientY});
window.addEventListener('pointerup',function(){dwn=false});
window.addEventListener('pointermove',function(e){if(!dwn)return;spherical.theta-=(e.clientX-lx)*0.005;spherical.phi-=(e.clientY-ly)*0.005;lx=e.clientX;ly=e.clientY;spherical.phi=Math.max(0.1,Math.min(1.4,spherical.phi))});
r.domElement.addEventListener('wheel',function(e){spherical.radius+=e.deltaY*0.01;spherical.radius=Math.max(3,Math.min(60,spherical.radius))});

function animate(){requestAnimationFrame(animate);c.position.setFromSpherical(spherical);c.position.add(target);c.lookAt(target);r.render(s,c)}animate();
</script></body></html>
