function mkCont(x,z,w,h,d,col,gid,items){

  [[-w/2,0,-d/2],[w/2,0,-d/2],[-w/2,0,d/2],[w/2,0,d/2]].forEach(function(p){var cp=B(0.06,h,0.06,steelIBeam);cp.position.set(p[0],0,p[2]);gr.add(cp)});
  var ccMat=new THREE.MeshStandardMaterial({color:0x666666,roughness:0.2,metalness:0.95});for(var cx=-1;cx<=1;cx+=2)for(var cy=-1;cy<=1;cy+=2)for(var cz=-1;cz<=1;cz+=2){var cc=B(0.1,0.1,0.1,ccMat);cc.position.set(cx*(w/2-0.05),cy*(h/2-0.05),cz*(d/2-0.05));gr.add(cc)}for(var sx=-1;sx<=1;sx+=2){var rl=B(0.1,0.22,d,steelIBeam);rl.position.set(sx*(w/2-0.05),-h/2+0.11,0);gr.add(rl)}for(var sx=-1;sx<=1;sx+=2)for(var sz=-1;sz<=1;sz+=2){var fk=B(0.11,0.1,0.35,new THREE.MeshBasicMaterial({color:0x080808}));fk.position.set(sx*(w/2-0.05),-h/2+0.06,sz*d*0.27);gr.add(fk)}var doorMat=new THREE.MeshPhysicalMaterial({color:col,roughness:0.4,metalness:0.3,clearcoat:0.3,transparent:true,opacity:0.5,map:ctex});for(var dx=-1;dx<=1;dx+=2)for(var dz=-1;dz<=1;dz+=2){var dr=B(w/2-0.04,h-0.12,0.04,doorMat);dr.position.set(dx*w/4,0,dz*(d/2-0.02));gr.add(dr)}
  if(items&&items.length>0){
  var ny=4,nx=Math.max(8,Math.round(w/(h/ny))),nz=Math.max(6,Math.round(d/(h/ny)));
  var cellW=w/nx,cellH=h/ny,cellD=d/nz,totalCells=nx*nz*ny;

  var dm2=new THREE.Object3D(),ci2=0;
  for(var ly=0;ly<ny;ly++)for(var iz=0;iz<nz;iz++)for(var ix=0;ix<nx;ix++){
    dm2.position.set((ix+0.5-nx/2)*cellW,-h/2+(ly+0.5)*cellH,(iz+0.5-nz/2)*cellD);
    dm2.scale.set(1,1,1);dm2.updateMatrix();gim.setMatrixAt(ci2++,dm2.matrix)
  }
  gim.instanceMatrix.needsUpdate=true;gr.add(gim);
  var totV=0;items.forEach(function(it){totV+=Math.max(0.001,parseFloat(it.v||0.01))});
  var catItems={};items.forEach(function(it,i){var cat=it.c;if(!catItems[cat])catItems[cat]=[];catItems[cat].push({v:Math.max(0.001,parseFloat(it.v||0.01)),idx:i})});
  var blocks=[];

    var vols=catItems[cat],pool=0,poolIdx=[];
    vols.forEach(function(vi){var cells=vi.v/totV*totalCells,side;
      if(cells>=2){side=Math.max(1,Math.round(Math.sqrt(Math.round(cells))));blocks.push({cat:cat,cells:Math.round(cells),side:side,idxs:[vi.idx]})}
      else if(cells>=1){blocks.push({cat:cat,cells:Math.round(cells),side:Math.round(cells),idxs:[vi.idx]})}
      else{pool+=cells;poolIdx.push(vi.idx);if(pool>=1){blocks.push({cat:cat,cells:Math.round(pool),side:Math.round(Math.sqrt(Math.round(pool))),idxs:poolIdx.slice()});pool=0;poolIdx=[]}}
    });

  });
  blocks.sort(function(a,b){return gid==='b2'?b.cells-a.cells:a.cells-b.cells});
  var curX=0,curZ=0,layer=0,rowMax=0,occ={},bid=0;

    blk._x=curX;blk._z=curZ;blk._ly=layer;

    curX+=s;rowMax=Math.max(rowMax,curZ+s)
  });
  var catCells={};
  for(var ly2=0;ly2<ny;ly2++)for(var iz2=0;iz2<nz;iz2++)for(var ix2=0;ix2<nx;ix2++){
    var ct=occ[ly2+'_'+iz2+'_'+ix2];if(ct){if(!catCells[ct])catCells[ct]=[];catCells[ct].push({x:ix2,z:iz2,ly:ly2})}
  }

    });
    im.instanceMatrix.needsUpdate=true;gr.add(im)
  })
}
  gr.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),new THREE.LineBasicMaterial({color:col})));
  var hb2=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({visible:false}));hb2.userData={g:gid,i:-1,frame:true};clicks.push(hb2);gr.add(hb2);mm[gid+'__frame']=gr;
  return gr;
}
