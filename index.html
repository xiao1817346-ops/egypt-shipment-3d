  var bm=new THREE.Mesh(bg,new THREE.MeshStandardMaterial({color:cfg.color,roughness:0.4,metalness:0.3,transparent:true,opacity:0.2}));
  bm.castShadow=true; bm.receiveShadow=true; g.add(bm);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(bg),new THREE.LineBasicMaterial({color:cfg.color})));
  var pg=new THREE.CylinderGeometry(0.05,0.05,h,6), pm=new THREE.MeshStandardMaterial({color:0x667,roughness:0.3,metalness:0.8});
  for(var x=-1;x<=1;x+=2)for(var z=-1;z<=1;z+=2){var p=new THREE.Mesh(pg,pm);p.position.set(x*w/2,0,z*d/2);p.castShadow=true;g.add(p);}
  var items=cfg.items,n=items.length;
  var cols=Math.ceil(Math.sqrt(n*(d/w))),rows=Math.ceil(n/cols);
  var cW=(w-0.4)/cols,cH=(h-0.4)/Math.min(rows,6),cD=(d-0.4)/Math.ceil(rows/6);
  items.forEach(function(item,i){
    var layer=Math.floor(i/(cols*6)),inL=i%(cols*6),col=inL%cols,row=inL%cols;
    var geo=Math.random()<0.5?new THREE.BoxGeometry(cW*0.7,cH*0.5,cD*0.7):new THREE.CylinderGeometry(cW*0.28,cW*0.28,cH*0.5,8);
    var m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:new THREE.Color(ch(item.c)),roughness:0.4}));
    m.position.set((col-cols/2+0.5)*cW,-h/2+0.3+(row+0.5)*cH,(layer-1+0.5)*cD);
    m.castShadow=true; m.userData={item:item,idx:DATA.indexOf(item)}; clickables.push(m); g.add(m);
    if(DATA.indexOf(item)>=0)itemMeshes[DATA.indexOf(item)]=m;
  });
  var ld=document.createElement('div');ld.textContent=cfg.name;ld.style.cssText='color:#fff;font-size:12px;font-weight:bold;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:4px;';
  var lbl=new THREE.CSS2DObject(ld);lbl.position.set(0,h/2+0.3,0);g.add(lbl);
  scene.add(g);
}

makeBox({name:'箱一：热处理设备',color:0xE74C3C,items:DATA.slice(43,58),pos:[-5,0,0],size:[3.5,2.5,2.5]});
makeBox({name:'箱二：保温保冷材料',color:0x3498DB,items:DATA.slice(58,70),pos:[0,0,0],size:[3.5,2.5,2.5]});
makeBox({name:'箱三：焊接机具',color:0x2ECC71,items:DATA.slice(70,329),pos:[5.5,0,0.5],size:[3.5,2.5,8]});

for(var i=0;i<8;i++){
  var bg=new THREE.Group();bg.position.set(-8+i*2.2,-1.5,4.5);
  var base=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.12,1.2),new THREE.MeshStandardMaterial({color:0x7B8D8E,roughness:0.3,metalness:0.8}));
  base.castShadow=true;base.receiveShadow=true;bg.add(base);
  for(var x=-1;x<=1;x+=2)for(var z=-1;z<=1;z+=2){
    var post=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.8,6),new THREE.MeshStandardMaterial({color:0x667,roughness:0.3,metalness:0.8}));
    post.position.set(x*0.8,0.4,z*0.5);post.castShadow=true;bg.add(post);
  }
  if(i<5&&DATA[33+i]){
    var bm=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.3,0.8),new THREE.MeshStandardMaterial({color:new THREE.Color(ch(DATA[33+i].c)),roughness:0.4}));
    bm.position.y=0.3;bm.castShadow=true;bm.userData={item:DATA[33+i],idx:33+i};clickables.push(bm);itemMeshes[33+i]=bm;bg.add(bm);
  }
  scene.add(bg);
}

var raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',function(e){
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var hits=raycaster.intersectObjects(clickables);
  if(hits.length>0){var idx=hits[0].object.userData.idx;if(idx>=0){hl(idx);document.getElementById('sel').textContent=DATA[idx].n;}}
});

function flyTo(idx){
  var mesh=itemMeshes[idx]; if(!mesh)return;
  hl(idx); document.getElementById('sel').textContent=DATA[idx].n;
  var wp=new THREE.Vector3(); mesh.getWorldPosition(wp);
  controls.target.lerp(wp,1);
  camera.position.lerp(wp.clone().add(new THREE.Vector3(3,2,3)),1);
}
window.flyTo=flyTo;window.filterTable=filterTable;

window.addEventListener('resize',function(){
  camera.aspect=v3d.clientWidth/v3d.clientHeight;camera.updateProjectionMatrix();
  renderer.setSize(v3d.clientWidth,v3d.clientHeight);
  labelRenderer.setSize(v3d.clientWidth,v3d.clientHeight);
});

function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera);}
animate();
</script>
